[package]
name = "adb-ethernet-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Recover a USB-tethered Android phone WAN after host startup"
publish = false

[[bin]]
name = "adb-wan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
# The library exists only to serve the binary and its tests; these two pedantic
# lints target published library APIs and only add noise here.
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
